<!doctype html>
<html lang="zh-CN" class="dark">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover：让内容铺满屏幕，由安全区变量（env(safe-area-inset-*)）避让系统栏 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- 空 favicon：避免控制台 favicon.ico 404 -->
    <link rel="icon" href="data:," />
    <!-- CSP：本地单用户应用，connect-src 放宽允许任意 http/https 与 ws/wss，
         以兼容自建 Ollama、局域网 API、SearXNG、协作服务端（atelyx-server）等。
         http://ipc.localhost 是 Tauri 2 的 IPC 协议地址，必须允许。
         script-src 的 blob: 供插件包入口的 ESM 求值（blob URL 动态 import）；
         wasm-unsafe-eval 供 esbuild-wasm 转译 TS 插件入口（插件代码在主上下文内执行，安装即授权）。
         frame-src 放行 http(s)：插件面板可内嵌本机/局域网服务的 web 界面（默认回落 default-src
         会把这类 iframe 挡成空白）。这是**声明而非边界**——iframe 页面是独立源，读不到父文档、
         也调不到宿主命令（Tauri IPC 按源判权），且内嵌加载不经 net_guard；防笔记正文里的不可信
         内容靠 DOMPurify 白名单（两个信任级别），不要为此收窄本指令。
         'self' 须保留：Linux 侧应用源是 tauri://localhost，不在 http/https 内。-->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; frame-src 'self' http: https:; img-src 'self' data: blob: https: http:; media-src 'self' data: blob: https: http:; connect-src 'self' http: https: ws: wss: http://ipc.localhost; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline' blob: 'wasm-unsafe-eval'"
    />
    <title>Atelyx</title>
    <!-- 主题配置就绪前按系统深浅预置（.dark 已写在 html 上，仅系统浅色时摘除）；底色按 class
         取 :root / :root.dark 的 --bg-primary 同值，就绪后由 useAppearance 按配置修正。 -->
    <script>
      if (!window.matchMedia("(prefers-color-scheme: dark)").matches) {
        document.documentElement.classList.remove("dark");
      }
    </script>
    <style>
      html{background:#131418}
      html:not(.dark){background:#eae9e3}
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
