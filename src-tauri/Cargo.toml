[package]
name = "atelyx"
version = "0.5.9"
description = "一款可拓展的桌面 AI 工作台：对话、笔记、表格、文件同台使用，AI 辅助贯穿，局域网多人协作"
authors = ["Atelyx"]
edition = "2021"
# 最低支持的 Rust 版本（各依赖对 rustc 下界的最高要求）
rust-version = "1.77.2"

# 库定义，供 tauri-build 引用：rlib 供桌面应用链接；cdylib 供安卓动态链接；
# staticlib 供移动端静态链接（tauri mobile 工程约定）
[lib]
name = "atelyx_lib"
crate-type = ["rlib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
# tray-icon：系统托盘（图标 + 右键菜单，见 tray.rs）；桌面能力，移动端构建忽略
tauri = { version = "2.1", features = ["tray-icon"] }
tauri-plugin-dialog = "2.0"
# 剪贴板写入（表格图片复制：前端 canvas 解码 RGBA → 核心 image 资源 → 本插件 arboard 写系统剪贴板）
tauri-plugin-clipboard-manager = "2"

# 序列化
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# 异步运行时（拖拽看门狗定时器 + 插件 git 命令执行 + 出网 DNS 解析的阻塞隔离；与 tauri 内置 tokio 同版本统一）
# fs/io-util：更新包流式落盘；macros：命令层的异步单测（#[tokio::test]）
tokio = { version = "1", features = ["rt", "time", "process", "fs", "io-util", "macros"] }

# 附件图片转 dataURL 供前端 MediaNode 显示（文件面板拖附件建节点）
base64 = "0.22"

# 工具
nanoid = "0.4"
chrono = "0.4"
# 会话容器真源（chat_container）：纯持久 op 建会话 id / 意图 id 派生
uuid = { version = "1", features = ["v4"] }

# 联网搜索代理：SearXNG 自建实例无内置 CORS，前端直 fetch 必被拦截，
# Tavily key 按官方 best practice 不应暴露给 WebView——搜索统一走 Rust 侧请求。
# rustls-tls 避免 Linux 打包依赖系统 openssl。
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# Windows 路径归一化：std::fs::canonicalize 在 Windows 返回 `\\?\` 长路径前缀，
# dunce::canonicalize 去除前缀、保持标准 Windows 路径（E:\xxx），跨平台同语义
dunce = "1"

# 仓库内文件检索（glob/grep AI 工具）：globset 为 glob 模式匹配（`**/` 任意深度语义）、
# regex 为内容搜索正则——两者即 ripgrep 所用的同一套引擎，保证搜索语义与业界一致
globset = "0.4"
regex = "1"

# 表格导出 xlsx（rust_xlsxwriter 原生生成，样式：表头/边框/列宽/冻结首行/图片嵌入）
rust_xlsxwriter = "0.80"

# 插件平台：安装源码包解压（防路径穿越/zip 炸弹；GitHub codeload 自动生成的归档）
zip = "2"

# 插件依赖获取：npm 注册表的 tarball 是 gzip 压缩的 tar，需自带解压；
# sha2 用于按 package-lock.json 的 integrity 逐包校验（锁到字节，下载内容不可信）；
# flate2 走纯 Rust 后端（默认 rust_backend），不引入 zlib C 依赖。
tar = "0.4"
flate2 = "1"
sha2 = "0.10"

# 桌面平台专属依赖（桌面壳与凭据实现；这些能力在移动端不存在，不参与其编译）
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-shell = "2.0"
# 开机自启：Windows 写 HKCU Run 注册表 / Linux 写 XDG autostart .desktop / macOS 写 LaunchAgent
tauri-plugin-autostart = "2"
# 单实例（须最先注册）：第二个进程启动即退出，转交首个实例处理
tauri-plugin-single-instance = "2"
# 全局快捷键（ctx.shortcuts 的 OS 层后端）：应用不在前台也可触发的系统热键注册与触发事件；
# 触发事件由 Rust 侧统一转投主窗口（见 commands/global_shortcut.rs），不经插件 JS 通道——
# 注册属应用级，不随注册窗口销毁失效
tauri-plugin-global-shortcut = "2"
# API key 安全存储（OS keychain：Windows Credential Manager / Linux Secret Service / macOS Keychain）
# 安全红线：API key 仅存 keychain，永不落仓库文件或 global.json
keyring = "4"

# 安卓凭据存储的 JNI 调用（经 webview JNI 线程调 Kotlin 桥 SecretStore：Keystore + 加密 SharedPreferences）
[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"

[target.'cfg(target_os = "windows")'.dependencies]
# 跨窗口拖拽释放检测（Windows 专用）：标签拖出窗口后 webview 收不到窗口外 pointerup，
# 前端轮询 GetAsyncKeyState(VK_LBUTTON) 物理判定鼠标已松开，终止拖拽会话并清除 drop 指示器；
# fileapi/winnt：插件卸载前递归清只读位（SMB/NAS 把 POSIX 444 映射成只读位会挡 remove_dir_all）；
# jobapi2/tlhelp32：插件托管进程的作业对象（创建/配置/加入/结束）与「挂起创建 → 恢复主线程」
# 让进程创建那一刻就纳入清理范围（见 plugin_process.rs）；
# shellapi：拉起已下载的更新安装包（ShellExecuteW 按 manifest 自行弹 UAC，见 commands/update.rs）
winapi = { version = "0.3", features = ["winuser", "fileapi", "winnt", "processthreadsapi", "handleapi", "errhandlingapi", "minwinbase", "jobapi2", "tlhelp32", "shellapi"] }
# 插件平台：本地目录安装的 Windows junction 创建（免管理员；Unix 走 std 符号链接）
junction = "0.2"

[target.'cfg(unix)'.dependencies]
# 插件托管进程（commands/process.rs 的进程树结束 + plugin_process.rs 的进程组）用 libc 直接下发
# 信号：不走 Command 调 kill(1)——外部工具不保证存在，且 `libc::kill` 才能按 errno 区分
# 「已不存在」（ESRCH）与真失败；`setpgid`/`killpg` 亦只有 libc 提供。
libc = "0.2"

[features]
# 自定义 protocol 用
custom-protocol = ["tauri/custom-protocol"]

# 发版优化：thin LTO 跨 crate 做链接期整体优化且并行执行；strip 剥离符号表。
# panic 策略保持默认 unwind——命令层依赖 unwind 收敛单命令 panic 不致进程退出。
[profile.release]
lto = "thin"
strip = true
