[package]
name = "atelyx"
version = "0.4.2"
description = "一款优雅的桌面创作工作台：把对话、笔记、表格都放到一张无限画布上，思路随手连，AI 帮你记和整理"
authors = ["Atelyx"]
edition = "2021"
# tauri-plugin-updater 要求 Rust >= 1.77.2
rust-version = "1.77.2"

# 库定义，供 tauri-build 引用（桌面端应用，rlib 足够）
[lib]
name = "atelyx_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.1", features = [] }
tauri-plugin-dialog = "2.0"
tauri-plugin-shell = "2.0"
# 自动更新完成后的应用重启（relaunch；v2 起 core API 不再含 process）
tauri-plugin-process = "2"
# 剪贴板写入（表格图片复制：前端 canvas 解码 RGBA → 核心 image 资源 → 本插件 arboard 写系统剪贴板）
tauri-plugin-clipboard-manager = "2"
# 自动检查更新：check/downloadAndInstall/签名校验（GitHub Release 静态 latest.json，见 4.18）
tauri-plugin-updater = "2"

# 序列化
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# 异步运行时（拖拽看门狗定时器 + 插件 git 命令执行；与 tauri 内置 tokio 同版本统一）
tokio = { version = "1", features = ["time", "process"] }

# 附件图片转 dataURL 供前端 MediaNode 显示（文件面板拖附件建节点）
base64 = "0.22"

# 工具
nanoid = "0.4"
chrono = "0.4"

# API key 安全存储（OS keychain：Windows Credential Manager / Linux Secret Service / macOS Keychain）
# 安全红线：API key 仅存 keychain，永不落仓库文件或 global.json
keyring = "4"

# 联网搜索代理：SearXNG 自建实例无内置 CORS，前端直 fetch 必被拦截，
# Tavily key 按官方 best practice 不应暴露给 WebView——搜索统一走 Rust 侧请求。
# rustls-tls 避免 Linux 打包依赖系统 openssl。
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# 仓库文件监听（外部编辑实时同步 + 断链降级）
# notify-debouncer-mini 合并原子写/编辑器多次保存的噪声事件（300ms 窗口）
notify = "6"
notify-debouncer-mini = "0.4"

# Windows 路径归一化：std::fs::canonicalize 在 Windows 返回 `\\?\` 长路径前缀，
# dunce::canonicalize 去除前缀、保持标准 Windows 路径（E:\xxx），跨平台同语义
dunce = "1"

# 仓库内文件检索（glob/grep AI 工具）：globset 为 glob 模式匹配（`**/` 任意深度语义）、
# regex 为内容搜索正则——两者即 ripgrep 所用的同一套引擎，保证搜索语义与业界一致
globset = "0.4"
regex = "1"

# 表格导出 xlsx（rust_xlsxwriter 原生生成，样式：表头/边框/列宽/冻结首行/图片嵌入）
rust_xlsxwriter = "0.80"

# 插件平台：安装源码包解压（防路径穿越/zip 炸弹；GitHub codeload 自动生成的归档）
zip = "2"

[target.'cfg(target_os = "windows")'.dependencies]
# 跨窗口拖拽释放检测（Windows 专用）：标签拖出窗口后 webview 收不到窗口外 pointerup，
# 前端轮询 GetAsyncKeyState(VK_LBUTTON) 物理判定鼠标已松开，终止拖拽会话并清除 drop 指示器
winapi = { version = "0.3", features = ["winuser"] }
# 插件平台：本地目录安装的 Windows junction 创建（免管理员；Unix 走 std 符号链接）
junction = "0.2"

[features]
# 自定义 protocol 用
custom-protocol = ["tauri/custom-protocol"]
