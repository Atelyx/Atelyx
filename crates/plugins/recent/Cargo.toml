[package]
name = "atelyx-plugin-recent"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Atelyx 最近打开插件：按容器身份展示打开过的文件（记录与失效剔除在宿主）"
license = "Apache-2.0"

[lib]
crate-type = ["cdylib"]

[dependencies]
atelyx-plugin-protocol = { version = "0.1.0", path = "../../plugin-protocol" }
atelyx-plugin-sdk = { version = "0.1.0", path = "../../plugin-sdk" }
async-trait = "0.1"
# 当前本地时区偏移：相对时间的日期档与宿主同一口径
chrono = { version = "0.4", default-features = false, features = ["clock"] }
tokio = { version = "1", features = ["sync"] }

[dev-dependencies]
serde_json = "1"
