[package]
name = "atelyx-plugin-canvas"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Atelyx 画布插件：白板视口、卡片与分组、对话卡、保存链与协作在场"
license = "Apache-2.0"

[lib]
crate-type = ["cdylib"]

[dependencies]
atelyx-format = { version = "0.1.0", path = "../../format" }
atelyx-plugin-protocol = { version = "0.1.0", path = "../../plugin-protocol" }
atelyx-plugin-sdk = { version = "0.1.0", path = "../../plugin-sdk" }
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "time", "rt"] }
uuid = { version = "1", features = ["v4"] }
nanoid = "0.4"
# 图片引用卡的像素尺寸（与宿主同一解码口径）
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
