[package]
name = "atelyx-plugin-sdk"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Atelyx 插件 SDK：握手、能力面代理、绘制指令构造与控件层（插件侧封装，协议类型见 atelyx-plugin-protocol）"
license = "Apache-2.0"
repository = "https://github.com/Atelyx/Atelyx"
readme = "../README.md"
# 端到端夹具与测试依赖仓库内的宿主 crate：发布包只出 SDK 本体，不带上它们
exclude = ["src/bin", "tests"]

[dependencies]
# version 供 crates.io 解析，path 供仓库内直接构建（打包时 path 会被去掉）
atelyx-plugin-protocol = { version = "0.1.0", path = "../plugin-protocol" }
# 同进程插件的 C 函数表（SDK 再导出，插件作者无需直接依赖）
atelyx-plugin-abi = { version = "0.1.0", path = "../plugin-abi" }
# Context 的定型调用借 serde 的 Serialize/DeserializeOwned trait（不用 derive）
serde = { version = "1", default-features = false }
serde_json = "1"
base64 = "0.22"
# 连接泵：stdin/stdout 读写（io-util/io-std）、读写任务与超时（rt/sync/time/macros）；
# rt-multi-thread 让插件的 #[tokio::main] 开箱即用
tokio = { version = "1", features = ["rt", "rt-multi-thread", "sync", "time", "macros", "io-util", "io-std"] }
thiserror = "2"
# PluginHandler 的 async trait：通知处理逐任务分发，future 必须 Send（盒装实现）
async-trait = "0.1"

[dev-dependencies]
# 宿主运行时端到端：仅测试用，插件侧生产依赖仍只有 SDK（core 不依赖 sdk，方向不反转）
atelyx-core = { path = "../core", features = ["test-support"] }

# 端到端夹具：都编译成 cdylib（与真实插件同形态），测试直接把产物当插件入口安装
[[example]]
name = "stub"
crate-type = ["cdylib"]

[[example]]
name = "frame_stub"
crate-type = ["cdylib"]

[[example]]
name = "editor_stub"
crate-type = ["cdylib"]

[[example]]
name = "service_stub"
crate-type = ["cdylib"]

[[example]]
name = "ai_stub"
crate-type = ["cdylib"]

[[example]]
name = "crasher"
crate-type = ["cdylib"]

