[package]
name = "atelyx-pack"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Atelyx 功能模块契约：视图元数据与注册表、宿主能力面入口、Pack 接口"
license = "Apache-2.0"
repository = "https://github.com/Atelyx/Atelyx"
readme = "../README.md"

[dependencies]
# 契约描述视图元数据，视图渲染直接返回 iced 元素（与宿主同一 iced 版本，工作区统一解析）
iced = { version = "0.14", features = ["advanced"] }
