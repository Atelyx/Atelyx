[package]
name = "atelyx"
version = "0.6.6"
edition = "2021"

[[bin]]
name = "atelyx"
path = "src/main.rs"

[dependencies]
atelyx-core = { path = "../../crates/core" }
atelyx-ui = { path = "../../crates/ui" }
# AI 对话：会话 id / 消息 id 生成（与 core 写链同版本）
uuid = { version = "1", features = ["v4"] }
# 最近打开条目（ui-state 透传字段）的序列化派生
serde = { version = "1", features = ["derive"] }
# 布局状态（ui-state.json）序列化
serde_json = "1"
# iced：advanced/canvas 自定义部件，image 标题栏图标。
iced = { version = "0.14", features = ["advanced", "canvas", "tokio", "image"] }
# 文件夹选择对话框。
rfd = "0.15"
# 表格稳定 id。
nanoid = "0.4"
# 图片解码（png/jpeg/gif/bmp/webp）。
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp", "webp"] }
# 剪贴板图片（Windows DIB / Linux data-control）。
arboard = { version = "3", features = ["wayland-data-control"] }
# 定时器 / 线程池 / 插件事件 broadcast。
tokio = { version = "1", default-features = false, features = ["time", "rt", "sync"] }

# Windows：Run 键 / ShellExecuteW / 托盘消息窗。
[target.'cfg(target_os = "windows")'.dependencies]
winreg = "0.55"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

# 开机自启（autostart）：Linux XDG autostart 目录定位
[target.'cfg(target_os = "linux")'.dependencies]
dirs = "6"

# exe 文件图标（资源管理器 / 开始菜单 / 快捷方式显示；任务栏图标由窗口图标承担）
[build-dependencies]
winresource = "0.1"

[dev-dependencies]
# 临时仓库夹具（与 core 测试同源；仅测试构建启用）
atelyx-core = { path = "../../crates/core", features = ["test-support"] }
