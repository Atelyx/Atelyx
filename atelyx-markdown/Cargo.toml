[package]
name = "atelyx-markdown"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Atelyx Markdown 解析：纯文本 → 源偏移标注块规格（宿主与插件共用的领域库）"
license = "Apache-2.0"

[dependencies]
# 行内语法的模式匹配（强调 / 链接 / 标签的候选定位）
regex = "1"
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
serde_json = "1"
