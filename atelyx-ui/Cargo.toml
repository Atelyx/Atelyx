[package]
name = "atelyx-ui"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Atelyx 界面组件库：调色板、字体、图标、基础控件、统一弹层与滚动容器（零业务语义）"
license = "Apache-2.0"
repository = "https://github.com/Atelyx/Atelyx"
readme = "../README.md"

[dependencies]
# 组件基元的渲染实现；与宿主使用同一 iced 版本（工作区统一解析）
iced = { version = "0.14", features = ["advanced", "canvas"] }

# 系统 UI 字体族枚举（Windows 消息字体度量）
[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging"] }
