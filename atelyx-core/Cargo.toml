[package]
name = "atelyx-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.77.2"
description = "Atelyx UI 无关核心：仓库存储、会话容器、补丁合并与写盘串行化、AI 客户端、协作帧泵、插件进程托管"

[dependencies]
# 仓库存储（vault）：id 生成 / 链接与标签正则 / 文件类型序列化与配置补丁合并 / Windows 路径归一化
nanoid = "0.4"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# frontmatter：YAML 解析（事件级 API 供自研 1.1 解析表使用，标量样式可区分引号形态）
yaml-rust2 = "0.10"
dunce = "1"
# 会话容器（chat_container）：持久 op 建 id / 写链线程与广播回执（spawn + oneshot + sleep）
tokio = { version = "1", features = ["rt", "sync", "time", "macros"] }
uuid = { version = "1", features = ["v4"] }
# 出网校验（net_guard）：URL 解析与地址枚举
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# 仓库内文件检索（filesearch）：glob 模式匹配（`**/` 任意深度语义，即 ripgrep 所用引擎）
globset = "0.4"
# 表格 xlsx 导出（table_xlsx）
rust_xlsxwriter = "0.89"
base64 = "0.22"
# xlsx 不支持的图片格式（webp 等）导出前转 PNG
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp", "webp"] }
# 系统下载/主目录定位（图片下载落盘）
dirs = "6"

# 插件进程托管（plugin_process）：Unix 进程组信号（setpgid/killpg/ESRCH 判定）
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# 插件进程托管（plugin_process）：作业对象（创建/配置/加入/结束）与「挂起创建 → 恢复主线程」、
# 插件卸载前递归清只读位
[target.'cfg(target_os = "windows")'.dependencies]
winapi = { version = "0.3", features = ["winnt", "processthreadsapi", "handleapi", "errhandlingapi", "minwinbase", "jobapi2", "tlhelp32"] }

[features]
# 测试基建（TempDir 等）供依赖方的测试构建复用；常规构建不编译
test-support = []
