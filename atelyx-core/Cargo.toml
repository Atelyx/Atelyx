[package]
name = "atelyx-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Atelyx UI 无关核心：仓库存储、会话容器、补丁合并与写盘串行化、AI 客户端、协作帧泵、插件进程托管"

[dependencies]
# 仓库存储（vault）：id 生成 / 链接与标签正则 / 文件类型序列化与配置补丁合并 / Windows 路径归一化
nanoid = "0.4"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# frontmatter：YAML 解析（事件级 API 供自研 1.1 解析表使用，标量样式可区分引号形态）
yaml-rust2 = "0.10"
dunce = "1"
# 会话容器（chat_container）：持久 op 建 id / 写链线程与广播回执（spawn + oneshot + sleep）
# 协作帧泵（collab）：WS 连接建立用 tokio::net（超时包裹），net 特性显式声明不靠传递启用
tokio = { version = "1", features = ["rt", "sync", "time", "macros", "net"] }
uuid = { version = "1", features = ["v4"] }
# 出网校验（net_guard）：URL 解析与地址枚举；blocking 供插件 http 能力面
# （宿主侧在插件进程的 stdout 读线程上同步执行请求，见 plugin_runtime/http.rs）
# stream 供 AI 对话流式客户端（bytes_stream 逐块读 SSE）
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "blocking", "stream"] }
# 仓库内文件检索（filesearch）：glob 模式匹配（`**/` 任意深度语义，即 ripgrep 所用引擎）
globset = "0.4"
# 表格 xlsx 导出（table_xlsx）
rust_xlsxwriter = "0.89"
base64 = "0.22"
# 插件协议类型（宿主运行时：信封解析、握手、能力面方法、整面帧与绘制指令）
atelyx-plugin-protocol = { path = "../atelyx-plugin-protocol" }
# 插件安装（plugin_runtime）：zip 解压（仅 deflate；防御见 install.rs）
zip = { version = "2", default-features = false, features = ["deflate"] }
# 目录安装按源目录 .gitignore 过滤（git 语义：嵌套规则 / 反选 / `**` / 目录锚定）
ignore = "0.4"
# xlsx 不支持的图片格式（webp 等）导出前转 PNG
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp", "webp"] }
# 系统下载/主目录定位（图片下载落盘）
dirs = "6"
# 笔记协作（note_collab）：Yjs CRDT 内核，与 yjs 数据互通
yrs = "0.28"
# 协作帧泵（collab）：WebSocket 长连接（rustls TLS，webpki 根证书）
tokio-tungstenite = { version = "0.30", default-features = false, features = ["rustls-tls-webpki-roots", "connect"] }
# 协作空间客户端（space_client）：错误类型与来源信息
thiserror = "2"
# 自动更新（updater）：安装包 sha256 流式校验
sha2 = "0.10"
hex = "0.4"
# 协作帧泵（collab）：tungstenite 流的 Sink/Stream 组合子
futures-util = "0.3"
# 全局快捷键（plugin_runtime/shortcut）：OS 级热键注册与触发；Windows 走消息窗 + RegisterHotKey，
# Linux 走 X11 XGrabKey（Wayland 无标准机制，按平台预检判不可用）
global-hotkey = "0.8"

# 凭据（credentials）：令牌存系统密钥链，不落明文。按平台启用真实后端——
# 不带平台 feature 时 keyring 3.x 落到内存 mock（写入不出进程，跨启动即 NoEntry）
[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6", features = ["apple-native"] }
[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3.6", features = ["sync-secret-service"] }

# 插件进程托管（plugin_process）：Unix 进程组信号（setpgid/killpg/ESRCH 判定）
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# 插件进程托管（plugin_process）：作业对象（创建/配置/加入/结束）与「挂起创建 → 恢复主线程」、
# 插件卸载前递归清只读位
[target.'cfg(target_os = "windows")'.dependencies]
winapi = { version = "0.3", features = ["winnt", "processthreadsapi", "handleapi", "errhandlingapi", "minwinbase", "jobapi", "jobapi2", "tlhelp32", "winerror", "winuser"] }
keyring = { version = "3.6", features = ["windows-native"] }

[features]
# 测试基建（TempDir 等）供依赖方的测试构建复用；常规构建不编译
test-support = []
