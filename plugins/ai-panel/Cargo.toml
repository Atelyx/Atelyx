[package]
name = "atelyx-plugin-ai-panel"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Atelyx AI 对话面板插件：会话侧栏、消息流、输入区与模型 / Agent 选择"
license = "Apache-2.0"

[lib]
crate-type = ["cdylib"]

[dependencies]
atelyx-plugin-protocol = { version = "0.1.0", path = "../../atelyx-plugin-protocol" }
atelyx-plugin-sdk = { version = "0.1.0", path = "../../atelyx-plugin-sdk" }
async-trait = "0.1"
serde_json = "1"
tokio = { version = "1", features = ["sync"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
atelyx-plugin-sdk = { version = "0.1.0", path = "../../atelyx-plugin-sdk", features = ["test-support"] }
tokio = { version = "1", features = ["macros", "rt", "time"] }
