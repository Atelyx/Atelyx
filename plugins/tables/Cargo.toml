[package]
name = "atelyx-plugin-tables"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Atelyx 表格插件：多维表格网格、编辑与保存链"
license = "Apache-2.0"

[lib]
crate-type = ["cdylib"]

[dependencies]
atelyx-format = { version = "0.1.0", path = "../../atelyx-format" }
atelyx-plugin-protocol = { version = "0.1.0", path = "../../atelyx-plugin-protocol" }
atelyx-plugin-sdk = { version = "0.1.0", path = "../../atelyx-plugin-sdk" }
async-trait = "0.1"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["sync", "time", "rt"] }
# 工作簿导出（与宿主原导出同库同选项）
rust_xlsxwriter = "0.89"
# 图片灯箱复制到剪贴板 / xlsx 嵌图前的格式转换
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
# 历史内嵌图片的 dataURL 解码
base64 = "0.22"
nanoid = "0.4"
