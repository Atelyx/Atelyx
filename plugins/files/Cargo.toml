[package]
name = "atelyx-plugin-files"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Atelyx 文件面板插件：仓库文件树、展开集、排序、目录颜色与提示词标记（读写经宿主）"
license = "Apache-2.0"

[lib]
crate-type = ["cdylib"]

[dependencies]
atelyx-plugin-protocol = { version = "0.1.0", path = "../../atelyx-plugin-protocol" }
atelyx-plugin-sdk = { version = "0.1.0", path = "../../atelyx-plugin-sdk" }
serde_json = "1"
async-trait = "0.1"
futures-util = "0.3"
tokio = { version = "1", features = ["sync"] }
