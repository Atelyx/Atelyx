[package]
name = "atelyx-plugin-search"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Atelyx 搜索插件：按文件名 / 路径检索当前仓库文件（清单与打开在宿主）"
license = "Apache-2.0"

[lib]
crate-type = ["cdylib"]

[dependencies]
atelyx-plugin-protocol = { version = "0.1.0", path = "../../atelyx-plugin-protocol" }
atelyx-plugin-sdk = { version = "0.1.0", path = "../../atelyx-plugin-sdk" }
async-trait = "0.1"
tokio = { version = "1", features = ["sync"] }

[dev-dependencies]
serde_json = "1"
