[workspace]
resolver = "2"
members = [
    "atelyx-app",
    "atelyx-core",
    "atelyx-ui",
    "atelyx-plugin-protocol",
    "atelyx-plugin-sdk",
    "plugins/calendar",
    "atelyx-plugin-abi",
    "atelyx-plugin-host",
    "atelyx-plugin-sample",
    "xtask",
]
exclude = ["atelyx-server"]

# 本地补丁版 winit 与 iced_widget（基线、改动与移除条件见 patches/README.md，
# 源码目录由 patches/apply.sh 从 crates.io 原始源码物化）。上游发布包含该修复的版本后可整目录移除。
[patch.crates-io]
winit = { path = "patches/winit" }
iced_widget = { path = "patches/iced_widget" }

# 开发档只保留行表调试信息：MSVC 的完整 debuginfo 会让每个 pdb 涨到数百 MB，
# 而 deps/incremental 里的旧产物 Cargo 永不回收。栈回溯仍有 文件:行号，断点看变量需临时改回 true。
[profile.dev]
debug = "line-tables-only"

# profile 仅在 workspace 根生效；发版用 thin LTO + strip。
[profile.release]
lto = "thin"
strip = true
