[workspace]
resolver = "2"
members = [
    "apps/atelyx",
    "crates/core",
    "crates/ui",
    "crates/plugin-protocol",
    "crates/plugin-abi",
    "crates/plugin-sdk",
    "xtask",
]
exclude = ["apps/server"]

# 本地补丁版 winit / iced_widget（物化与基线见 patches/README.md）。
[patch.crates-io]
winit = { path = "patches/winit" }
iced_widget = { path = "patches/iced_widget" }

# 只保留行表：完整 debuginfo 让 pdb 与 deps 持续膨胀。
[profile.dev]
debug = "line-tables-only"

# 非 ASCII 路径下 ring 的 cl /Z7 记录触发 D8050，只对该依赖关调试信息。
[profile.dev.package.ring]
debug = false

# profile 仅在 workspace 根生效；发版用 thin LTO + strip。
[profile.release]
lto = "thin"
strip = true
