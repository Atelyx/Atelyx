[workspace]
resolver = "2"
members = ["atelyx-app", "atelyx-core", "atelyx-ui", "atelyx-view", "atelyx-plugin-protocol", "atelyx-plugin-sdk", "xtask"]
exclude = ["atelyx-server"]

# 本地补丁版 winit 与 iced_widget（基线、改动与移除条件见 patches/README.md，
# 源码目录由 patches/apply.sh 从 crates.io 原始源码物化）。上游发布包含该修复的版本后可整目录移除。
[patch.crates-io]
winit = { path = "patches/winit" }
iced_widget = { path = "patches/iced_widget" }

# profile 仅在 workspace 根生效；发版用 thin LTO + strip。
[profile.release]
lto = "thin"
strip = true
