    --bg-primary: #f8fafc; --bg-secondary: #ffffff; --bg-tertiary: #f1f5f9; --bg-card: #ffffff;
    --text-primary: #0f172a; --text-secondary: #475569; --text-muted: #94a3b8;
    --border: #e2e8f0; --border-strong: #cbd5e1; --hover: #f1f5f9;
    --accent: #d4af37; --accent-hover: #b8962e; --accent-fg: #1c1c1e;
    --accent-tint: color-mix(in srgb, var(--accent) 14%, transparent);
    --accent-soft: color-mix(in srgb, var(--accent) 30%, transparent);
    --danger: #d92d20; --danger-tint: rgba(217, 45, 32, .09);
    --ok: #0f7a55; --ok-tint: rgba(15, 122, 85, .1);
    --warn: #a8720f; --warn-tint: rgba(168, 114, 15, .1);
    --code-bg: #f1f5f9; --log-bg: #ffffff; --row-hover: rgba(15, 23, 42, .035);
    --shadow-card: 0 1px 2px rgba(15, 23, 42, .05), 0 18px 40px -32px rgba(15, 23, 42, .5);
    --shadow-pop: 0 12px 34px -12px rgba(15, 23, 42, .3);
    --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI Variable Text", "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
    --font-mono: ui-monospace, "Cascadia Mono", SFMono-Regular, Consolas, "JetBrains Mono", monospace;
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg-primary: #1e1e1e; --bg-secondary: #252526; --bg-tertiary: #2a2d2e; --bg-card: #252526;
    --text-primary: #dcdcdc; --text-secondary: #9a9a9a; --text-muted: #8b8b8b;
    --border: #333333; --border-strong: #414141; --hover: #2a2d2e;
    --accent: #d4af37; --accent-hover: #e2c45c; --accent-fg: #1c1c1e;
    --danger: #f97066; --danger-tint: rgba(249, 112, 102, .13);
    --ok: #4ade80; --ok-tint: rgba(74, 222, 128, .13);
    --warn: #e0b64a; --warn-tint: rgba(224, 182, 74, .12);
    --code-bg: #161616; --log-bg: #161616; --row-hover: rgba(255, 255, 255, .035);
    --shadow-card: 0 1px 2px rgba(0, 0, 0, .35), 0 20px 44px -34px rgba(0, 0, 0, .9);
    --shadow-pop: 0 18px 44px -14px rgba(0, 0, 0, .7);
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg-primary); color: var(--text-primary);
    font: 14px/1.6 var(--font-ui);
    -webkit-font-smoothing: antialiased;
  }
  .hidden { display: none !important; }
  ::selection { background: var(--accent-soft); }
  :focus-visible { outline: 2px solid var(--accent-soft); outline-offset: 1px; }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb {
    background: var(--border-strong); border-radius: 8px; border: 3px solid transparent; background-clip: content-box;
  }
  ::-webkit-scrollbar-thumb:hover { background: var(--text-muted); background-clip: content-box; }
  ::-webkit-scrollbar-track { background: transparent; }

  .i { width: 16px; height: 16px; flex: none; }
  .i.sm { width: 14px; height: 14px; }

  /* ===== 按钮 ===== */
  .btn {
    display: inline-flex; align-items: center; gap: 6px; font: inherit; font-size: 13px;
    padding: 6px 11px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--bg-card); color: var(--text-primary); cursor: pointer;
    transition: background .14s, border-color .14s, color .14s, transform .1s;
  }
  .btn:hover { background: var(--hover); border-color: var(--border-strong); }
  .btn:active { transform: translateY(1px); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); font-weight: 600; }
  .btn.primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
  .btn.ghost { background: transparent; border-color: transparent; color: var(--text-secondary); }
  .btn.ghost:hover { background: var(--hover); color: var(--text-primary); }
  .btn.danger { color: var(--danger); border-color: color-mix(in srgb, var(--danger) 35%, var(--border)); }
  .btn.danger:hover { background: var(--danger-tint); border-color: var(--danger); }
  .btn.sm { padding: 3px 9px; font-size: 12px; border-radius: 7px; }
  .icon-btn {
    display: inline-flex; align-items: center; justify-content: center; width: 32px; height: 32px;
    border-radius: 8px; border: 1px solid transparent; background: transparent;
    color: var(--text-secondary); cursor: pointer; transition: background .14s, color .14s;
  }
  .icon-btn:hover { background: var(--hover); color: var(--text-primary); }

  /* ===== 表单 ===== */
  input, select, textarea {
    font: inherit; font-size: 13px; color: var(--text-primary); background: var(--bg-card);
    border: 1px solid var(--border); border-radius: 8px; padding: 7px 10px; min-width: 0;
  }
  input::placeholder { color: var(--text-muted); }
  input:hover, select:hover { border-color: var(--border-strong); }
  input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-tint); }
  .field { display: flex; flex-direction: column; gap: 6px; }
  .field > span { font-size: 12px; color: var(--text-secondary); letter-spacing: .02em; }
  .select-wrap { position: relative; display: inline-flex; }
  .select-wrap select { appearance: none; padding-right: 30px; cursor: pointer; }
  .select-wrap .chev {
    position: absolute; right: 9px; top: 50%; transform: translateY(-50%);
    pointer-events: none; color: var(--text-muted);
  }

  /* ===== 应用外壳 ===== */
  .shell { display: flex; min-height: 100vh; }
  .rail {
    width: 218px; flex: none; display: flex; flex-direction: column;
    background: var(--bg-secondary); border-right: 1px solid var(--border);
    position: sticky; top: 0; height: 100vh;
  }
  .brand { display: flex; align-items: center; gap: 10px; padding: 18px 16px 14px; }
  .brand-mark {
    width: 28px; height: 28px; border-radius: 8px; flex: none;
    background: var(--app-icon) center / contain no-repeat;
    box-shadow: 0 6px 14px -8px rgba(0, 0, 0, .6);
  }
  .brand-mark.lg { width: 34px; height: 34px; border-radius: 10px; }
  .brand-text { display: flex; flex-direction: column; line-height: 1.25; }
  .brand-text b { font-size: 13.5px; font-weight: 650; letter-spacing: .01em; }
  .brand-text span { font-size: 11px; color: var(--text-muted); }
  .nav { display: flex; flex-direction: column; gap: 2px; padding: 6px 8px; overflow-y: auto; }
  .nav-label {
    font-size: 10.5px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase;
    color: var(--text-muted); padding: 12px 8px 4px;
  }
  .nav-item {
    position: relative; display: flex; align-items: center; gap: 10px; width: 100%;
    font: inherit; font-size: 13.5px; text-align: left; padding: 8px 10px; border-radius: 8px;
    background: transparent; border: 1px solid transparent; color: var(--text-secondary); cursor: pointer;
    transition: background .14s, color .14s, border-color .14s;
  }
  .nav-item:hover { background: var(--hover); color: var(--text-primary); }
  .nav-item.active {
    background: var(--accent-tint); border-color: var(--accent-soft); color: var(--text-primary); font-weight: 550;
  }
  .nav-item.active .i { color: var(--accent); }
  .nav-item.active::before {
    content: ''; position: absolute; left: -9px; top: 50%; transform: translateY(-50%);
    width: 2px; height: 16px; border-radius: 2px; background: var(--accent);
  }
  .rail-foot {
    margin-top: auto; border-top: 1px solid var(--border); padding: 10px 12px;
    display: flex; align-items: center; gap: 8px;
  }
  .avatar {
    width: 26px; height: 26px; border-radius: 8px; flex: none; display: grid; place-items: center;
    font-size: 12px; font-weight: 650; background: var(--bg-tertiary);
    border: 1px solid var(--border); color: var(--text-secondary);
  }
  .rail-foot .who { flex: 1; min-width: 0; }
  .rail-foot .who b { display: block; font-size: 12.5px; font-weight: 550; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .rail-foot .who span { font-size: 10.5px; color: var(--text-muted); }

  .main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .topbar {
    position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 14px;
    padding: 16px 26px 14px; background: color-mix(in srgb, var(--bg-primary) 88%, transparent);
    backdrop-filter: blur(10px); border-bottom: 1px solid var(--border);
  }
  .topbar h1 { font-size: 17px; font-weight: 620; margin: 0; letter-spacing: -.01em; }
  .topbar .sub { margin: 2px 0 0; font-size: 12px; color: var(--text-muted); }
  .topbar-actions { margin-left: auto; display: flex; align-items: center; gap: 8px; }
  .content { padding: 22px 26px 60px; max-width: 1180px; width: 100%; }

  /* ===== 通用块 ===== */
  .pill {
    display: inline-flex; align-items: center; gap: 7px; font-size: 12px; padding: 5px 11px;
    border-radius: 999px; border: 1px solid var(--border); background: var(--bg-card); color: var(--text-secondary);
  }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); flex: none; }
  .dot.live { animation: pulse 2.4s ease-out infinite; }
  .dot.idle { background: var(--text-muted); }
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 var(--accent-soft); }
    70% { box-shadow: 0 0 0 7px transparent; }
    100% { box-shadow: 0 0 0 0 transparent; }
  }
  @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

  .card {
    background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px;
    padding: 14px 16px; box-shadow: var(--shadow-card);
  }
  .eyebrow {
    font-size: 10.5px; font-weight: 600; letter-spacing: .11em; text-transform: uppercase; color: var(--text-muted);
  }
  .stat-value {
    font-family: var(--font-mono); font-variant-numeric: tabular-nums; font-size: 22px;
    letter-spacing: -.02em; margin-top: 7px; line-height: 1.25;
  }
  .stat-value.sm { font-size: 14px; letter-spacing: 0; }
  .stat-foot { font-size: 11.5px; color: var(--text-muted); margin-top: 3px; }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(178px, 1fr)); gap: 12px; }
  .cards .card { animation: rise .34s cubic-bezier(.2, .7, .3, 1) backwards; }
  .cards .card:nth-child(2) { animation-delay: .04s; }
  .cards .card:nth-child(3) { animation-delay: .08s; }
  .cards .card:nth-child(4) { animation-delay: .12s; }
  .cards .card:nth-child(5) { animation-delay: .16s; }

  .hero {
    position: relative; overflow: hidden; border-radius: 14px; border: 1px solid var(--border);
    background: var(--bg-card); box-shadow: var(--shadow-card); padding: 18px 20px;
    display: flex; align-items: center; gap: 18px; flex-wrap: wrap;
    animation: rise .34s cubic-bezier(.2, .7, .3, 1) backwards;
  }
  .hero::after {
    content: ''; position: absolute; inset: 0 0 auto; height: 1px;
    background: linear-gradient(90deg, transparent, var(--accent-soft) 22%, var(--accent-soft) 78%, transparent);
  }
  .hero::before {
    content: ''; position: absolute; right: -70px; top: -110px; width: 260px; height: 260px;
    background: radial-gradient(circle, var(--accent-tint), transparent 66%); pointer-events: none;
  }
  .hero-title { display: flex; align-items: center; gap: 10px; font-size: 15px; font-weight: 600; }
  .hero-sub { font-size: 12px; color: var(--text-muted); margin-top: 4px; }
  .hero-stats { margin-left: auto; display: flex; gap: 26px; flex-wrap: wrap; position: relative; }
  .hero-stats div { display: flex; flex-direction: column; gap: 2px; }
  .hero-stats b { font-family: var(--font-mono); font-size: 13.5px; font-weight: 500; font-variant-numeric: tabular-nums; }
  .hero-stats span { font-size: 10.5px; color: var(--text-muted); letter-spacing: .06em; text-transform: uppercase; }

  .section-head { display: flex; align-items: center; gap: 12px; margin: 30px 0 13px; }
  .section-head h2 { margin: 0; font-size: 13.5px; font-weight: 600; letter-spacing: .01em; }
  .section-head .rule { flex: 1; height: 1px; background: linear-gradient(90deg, var(--border), transparent); }
  .section-head .count { font-size: 11.5px; color: var(--text-muted); font-variant-numeric: tabular-nums; }
  .hint { font-size: 12.5px; color: var(--text-muted); }

  .table-wrap { border: 1px solid var(--border); border-radius: 12px; overflow: hidden; background: var(--bg-card); }
  table { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 13px; }
  th {
    font-size: 10.5px; font-weight: 600; letter-spacing: .09em; text-transform: uppercase; color: var(--text-muted);
    text-align: left; padding: 9px 13px; background: var(--bg-tertiary); border-bottom: 1px solid var(--border); white-space: nowrap;
  }
  td { padding: 10px 13px; border-bottom: 1px solid var(--border); white-space: nowrap; }
  tbody tr:last-child td { border-bottom: none; }
  tbody tr { transition: background .12s; }
  tbody tr:hover { background: var(--row-hover); }
  td.wrap, th.wrap { white-space: normal; word-break: break-all; }
  .mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
  .muted { color: var(--text-muted); }
  .dim { color: var(--text-secondary); }
  .empty { padding: 20px 13px; color: var(--text-muted); font-size: 13px; }
  .row-actions { display: flex; gap: 6px; }

  .badge {
    display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 500;
    padding: 2px 8px; border-radius: 999px; border: 1px solid var(--border); color: var(--text-secondary);
  }
  .badge.owner { color: var(--accent); background: var(--accent-tint); border-color: var(--accent-soft); }
  .badge.editor { color: var(--text-primary); background: var(--hover); }
  .badge.viewer { color: var(--text-muted); }
  .badge.ok { color: var(--ok); background: var(--ok-tint); border-color: transparent; }
  code.code {
    font-family: var(--font-mono); font-size: 12.5px; background: var(--code-bg);
    border: 1px solid var(--border); color: var(--text-primary); padding: 2px 7px; border-radius: 6px;
  }

  /* ===== 空间卡 ===== */
  .space-card { padding: 0; overflow: hidden; margin-bottom: 14px; }
  .space-head { display: flex; align-items: center; gap: 10px; padding: 14px 16px; flex-wrap: wrap; }
  .space-head .name { font-size: 14.5px; font-weight: 600; }
  .space-head .spacer { flex: 1; }
  .seg { display: inline-flex; gap: 2px; padding: 2px; background: var(--bg-tertiary); border: 1px solid var(--border); border-radius: 9px; }
  .seg button {
    font: inherit; font-size: 12.5px; padding: 4px 11px; border-radius: 7px; cursor: pointer;
    background: transparent; border: none; color: var(--text-secondary); transition: background .14s, color .14s;
  }
  .seg button:hover { color: var(--text-primary); }
  .seg button.active { background: var(--bg-card); color: var(--text-primary); box-shadow: var(--shadow-card); }
  .pane { border-top: 1px solid var(--border); }
  .pane table th { background: transparent; }
  .invite-form { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; padding: 12px 16px; border-bottom: 1px solid var(--border); }
  .invite-form input { width: 168px; }
  .space-foot { padding: 10px 16px; }

  /* ===== 日志控制台 ===== */
  .console { border: 1px solid var(--border); border-radius: 14px; overflow: hidden; background: var(--log-bg); box-shadow: var(--shadow-card); }
  .console-bar {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 10px 12px;
    background: var(--bg-secondary); border-bottom: 1px solid var(--border);
  }
  .console-bar .spacer { flex: 1; }
  .console-body {
    position: relative; height: calc(100vh - 300px); min-height: 300px; overflow: auto;
    font-family: var(--font-mono); font-size: 12.5px; line-height: 1.7;
  }
  .log-row {
    display: grid; grid-template-columns: 96px 54px minmax(0, 1fr) 200px; gap: 12px;
    padding: 1px 14px; border-left: 2px solid transparent;
  }
  .log-row:hover { background: var(--row-hover); }
  .log-time { color: var(--text-muted); font-variant-numeric: tabular-nums; }
  .log-lv { font-size: 10px; font-weight: 650; letter-spacing: .09em; text-transform: uppercase; align-self: center; color: var(--text-muted); }
  .log-msg { color: var(--text-primary); white-space: pre-wrap; word-break: break-word; }
  .log-fields { color: var(--text-secondary); }
  .log-target { color: var(--text-muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; opacity: .85; }
  .log-row.lv-debug .log-msg { color: var(--text-secondary); }
  .log-row.lv-warn { border-left-color: var(--warn); background: var(--warn-tint); }
  .log-row.lv-warn .log-lv { color: var(--warn); }
  .log-row.lv-error { border-left-color: var(--danger); background: var(--danger-tint); }
  .log-row.lv-error .log-lv { color: var(--danger); }
  .log-empty { padding: 26px 16px; color: var(--text-muted); font-family: var(--font-ui); font-size: 13px; }
  .console-foot {
    display: flex; align-items: center; gap: 12px; padding: 8px 14px; font-size: 11.5px; color: var(--text-muted);
    border-top: 1px solid var(--border); background: var(--bg-secondary); font-family: var(--font-ui);
  }
  .console-foot .spacer { flex: 1; }
  .follow-pill { position: absolute; right: 16px; bottom: 14px; box-shadow: var(--shadow-pop); }

  /* ===== 登录页 ===== */
  .login-shell {
    min-height: 100vh; display: grid; place-items: center; padding: 28px;
    background:
      radial-gradient(700px 420px at 12% -8%, var(--accent-tint), transparent 70%),
      radial-gradient(560px 420px at 108% 108%, color-mix(in srgb, var(--accent) 8%, transparent), transparent 72%),
      var(--bg-primary);
  }
  .login-card {
    width: min(880px, 100%); display: grid; grid-template-columns: 1.05fr .95fr;
    background: var(--bg-card); border: 1px solid var(--border); border-radius: 18px;
    box-shadow: var(--shadow-pop); overflow: hidden; animation: rise .4s cubic-bezier(.2, .7, .3, 1);
  }
  .login-aside { padding: 34px 32px; background: var(--bg-secondary); border-right: 1px solid var(--border); }
  .login-aside h2 { font-size: 19px; margin: 18px 0 8px; letter-spacing: -.015em; }
  .login-aside p { margin: 0; font-size: 13px; color: var(--text-secondary); line-height: 1.75; }
  .login-points { list-style: none; margin: 22px 0 0; padding: 0; display: flex; flex-direction: column; gap: 11px; }
  .login-points li { display: flex; gap: 10px; font-size: 12.5px; color: var(--text-secondary); }
  .login-points .i { color: var(--accent); margin-top: 2px; }
  .login-form { padding: 34px 32px; display: flex; flex-direction: column; gap: 14px; }
  .login-form h1 { font-size: 15px; margin: 0 0 2px; }
  .login-form .btn.primary { justify-content: center; padding: 9px 12px; }
  .error { color: var(--danger); font-size: 12.5px; margin: 0; }

  /* ===== 弹层 ===== */
  .modal-layer {
    position: fixed; inset: 0; z-index: 40; display: grid; place-items: center; padding: 20px;
    background: color-mix(in srgb, #000 42%, transparent); backdrop-filter: blur(2px);
  }
  .modal {
    width: min(420px, 100%); background: var(--bg-card); border: 1px solid var(--border);
    border-radius: 14px; box-shadow: var(--shadow-pop); padding: 20px 20px 16px;
    animation: rise .22s cubic-bezier(.2, .7, .3, 1);
  }
  .modal h3 { margin: 0 0 6px; font-size: 15px; }
  .modal .modal-text { margin: 0; font-size: 13px; color: var(--text-secondary); line-height: 1.7; }
  .modal .field { margin-top: 14px; }
  .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 20px; }
  #toast {
    position: fixed; left: 50%; bottom: 30px; transform: translateX(-50%);
    display: flex; align-items: center; gap: 8px; max-width: 78vw;
    background: var(--bg-card); border: 1px solid var(--border); color: var(--text-primary);
    border-radius: 10px; padding: 9px 16px; box-shadow: var(--shadow-pop); font-size: 13px; z-index: 50;
    animation: rise .22s cubic-bezier(.2, .7, .3, 1);
  }
  #toast.err { border-color: color-mix(in srgb, var(--danger) 55%, var(--border)); }
  #toast.err .dot { background: var(--danger); }
  #toast .dot { background: var(--accent); }

  /* ===== 窄屏 ===== */
  @media (max-width: 900px) {
    .log-row { grid-template-columns: 84px 50px minmax(0, 1fr); }
    .log-target { display: none; }
  }
  @media (max-width: 780px) {
    .shell { flex-direction: column; }
    .rail { width: 100%; height: auto; position: static; flex-direction: row; align-items: center; border-right: none; border-bottom: 1px solid var(--border); overflow-x: auto; }
    .brand { padding: 12px 14px; }
    .brand-text { display: none; }
    .nav { flex-direction: row; padding: 8px 6px; }
    .nav-label { display: none; }
    .nav-item { width: auto; white-space: nowrap; }
    .nav-item.active::before { display: none; }
    .rail-foot { margin: 0 6px 0 auto; border-top: none; padding: 0 8px; }
    .rail-foot .who { display: none; }
    .topbar { padding: 12px 16px; }
    .content { padding: 16px 16px 48px; }
    .login-card { grid-template-columns: 1fr; }
    .login-aside { display: none; }
    .console-body { height: 60vh; }
  }
</style>
</head>
<body>

<!-- ===== 登录 ===== -->
<div id="login" class="login-shell hidden">
  <div class="login-card">
    <aside class="login-aside">
      <div class="brand-mark lg" role="img" aria-label="Atelyx"></div>
      <h2>Atelyx 协作服务端</h2>
      <p>空间内容真源、成员与邀请码、实时频道的管理入口。</p>
      <ul class="login-points">
        <li><svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="m4 12 5 5 11-11"/></svg>与桌面客户端同一批接口，权限在服务端强制校验</li>
        <li><svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="m4 12 5 5 11-11"/></svg>管理台不浏览空间内容，只做账号与名册处置</li>
        <li><svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="m4 12 5 5 11-11"/></svg>服务器管理员可查看实时服务日志</li>
      </ul>
    </aside>
    <form id="login-form" class="login-form" autocomplete="on">
      <div>
        <h1>登录管理台</h1>
        <p class="hint">使用服务端账号密码登录，令牌只保存在本机浏览器。</p>
      </div>
      <label class="field"><span>用户名</span>
        <input id="login-username" autocomplete="username" required>
      </label>
      <label class="field"><span>密码</span>
        <input id="login-password" type="password" autocomplete="current-password" required>
      </label>
      <button type="submit" class="btn primary">登录</button>
      <p id="login-error" class="error hidden"></p>
    </form>
  </div>
</div>

<!-- ===== 主壳 ===== -->
<div id="shell" class="shell hidden">
  <aside class="rail">
    <div class="brand">
      <div class="brand-mark" role="img" aria-label="Atelyx"></div>
      <div class="brand-text"><b>Atelyx</b><span>协作服务端</span></div>
    </div>
    <nav class="nav" id="nav">
      <div class="nav-label">工作区</div>
      <button class="nav-item active" data-view="overview">
        <svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h4l3 8 4-16 3 8h4"/></svg>
        <span>概览</span>
      </button>
      <button class="nav-item" data-view="spaces">
        <svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 3 8l9 5 9-5-9-5Z"/><path d="m3 13 9 5 9-5"/></svg>
        <span>我的空间</span>
      </button>
      <button class="nav-item" data-view="devices">
        <svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg>
        <span>我的设备</span>
      </button>
      <div class="nav-label hidden" id="nav-label-admin">服务器</div>
      <button class="nav-item hidden" data-view="admin" id="nav-admin">
        <svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M16 20v-1.6a4 4 0 0 0-4-4H7.5a4 4 0 0 0-4 4V20"/><circle cx="9.7" cy="7.4" r="3.4"/><path d="M17.4 11.2a3.4 3.4 0 1 0 0-6.9"/><path d="M21 20v-1.6a3.6 3.6 0 0 0-2.6-3.4"/></svg>
        <span>全服管理</span>
      </button>
      <button class="nav-item hidden" data-view="logs" id="nav-logs">
        <svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="m7.5 9.5 2.8 2.8-2.8 2.8"/><path d="M13 15.2h4"/></svg>
        <span>服务日志</span>
      </button>
    </nav>
    <div class="rail-foot">
      <div class="avatar" id="who-avatar">·</div>
      <div class="who"><b id="who">–</b><span id="who-role">–</span></div>
      <button class="icon-btn" id="btn-theme" title="切换主题"></button>
      <button class="icon-btn" id="btn-logout" title="退出登录">
        <svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4h4a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-4"/><path d="M10 16l-4-4 4-4"/><path d="M6 12h9"/></svg>
      </button>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <div>
        <h1 id="view-title">概览</h1>
        <p class="sub" id="view-sub">服务端运行状态与关键指标</p>
      </div>
      <div class="topbar-actions">
        <span class="pill" id="server-pill"><span class="dot idle" id="server-dot"></span><span id="server-pill-text">连接中…</span></span>
        <button class="btn" id="btn-refresh">
          <svg class="i sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20.5 12a8.5 8.5 0 1 1-2.5-6"/><path d="M21 4v5h-5"/></svg>
          刷新
        </button>
      </div>
    </header>

    <div class="content">
      <!-- 概览 -->
      <section class="view" id="view-overview">
        <div class="hero">
          <div>
            <div class="hero-title"><span class="dot live" id="hero-dot"></span><span id="hero-state">服务运行中</span></div>
            <div class="hero-sub" id="hero-sub">Atelyx 协作服务端</div>
          </div>
          <div class="hero-stats">
            <div><b id="ov-started">–</b><span>启动时刻</span></div>
            <div><b id="ov-uptime">–</b><span>已运行</span></div>
            <div><b id="ov-online">–</b><span>在线连接</span></div>
          </div>
        </div>
        <div class="section-head">
          <h2>关键指标</h2><div class="rule"></div><span class="count" id="ov-scope">我的</span>
        </div>
        <div class="cards" id="ov-cards"></div>
      </section>

      <!-- 我的空间 -->
      <section class="view hidden" id="view-spaces">
        <div class="card" style="display:flex;gap:10px;flex-wrap:wrap;align-items:center">
          <span class="eyebrow">用邀请码加入</span>
          <input id="join-code" placeholder="粘贴邀请码" style="width:220px">
          <button class="btn" data-act="join-invite">加入空间</button>
          <span class="spacer" style="flex:1"></span>
          <button class="btn primary" data-act="space-new">
            <svg class="i sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
            新建空间
          </button>
        </div>
        <div class="section-head"><h2>参与的空间</h2><div class="rule"></div><span class="count" id="spaces-count"></span></div>
        <div id="spaces-list"></div>
      </section>

      <!-- 我的设备 -->
      <section class="view hidden" id="view-devices">
        <div class="section-head"><h2>登录会话</h2><div class="rule"></div><span class="count" id="devices-count"></span></div>
        <div class="table-wrap"><table id="devices"></table></div>
      </section>

      <!-- 全服管理 -->
      <section class="view hidden" id="view-admin">
        <div class="section-head"><h2>用户</h2><div class="rule"></div><span class="count" id="admin-users-count"></span></div>
        <div class="table-wrap" style="overflow-x:auto"><table id="admin-users"></table></div>
        <div class="section-head"><h2>全部空间</h2><div class="rule"></div><span class="count" id="admin-spaces-count"></span></div>
        <div class="table-wrap" style="overflow-x:auto"><table id="admin-spaces"></table></div>
      </section>

      <!-- 服务日志 -->
      <section class="view hidden" id="view-logs">
        <div class="console">
          <div class="console-bar">
            <span class="pill" id="log-live"><span class="dot idle" id="log-dot"></span><span id="log-live-text">未连接</span></span>
            <div class="select-wrap">
              <select id="log-level" title="级别下限">
                <option value="trace">trace 以上</option>
                <option value="debug">debug 以上</option>
                <option value="info" selected>info 以上</option>
                <option value="warn">warn 以上</option>
                <option value="error">仅 error</option>
              </select>
              <svg class="i sm chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
            </div>
            <span class="spacer"></span>
            <button class="btn" id="btn-log-pause">
              <span id="log-pause-icon"></span>
              <span id="log-pause-text">暂停</span>
            </button>
          </div>
          <div class="console-body" id="log-body">
            <div class="log-empty">正在读取日志…</div>
          </div>
          <div class="console-foot">
            <span id="log-stat">–</span>
          </div>
        </div>
      </section>
    </div>
  </main>
</div>

<!-- 通用弹层 -->
<div id="modal" class="modal-layer hidden" role="dialog" aria-modal="true">
  <div class="modal">
    <h3 id="modal-title"></h3>
    <p class="modal-text" id="modal-text"></p>
    <label class="field hidden" id="modal-field"><span id="modal-label"></span><input id="modal-input"></label>
    <div class="modal-actions">
      <button class="btn" id="modal-cancel">取消</button>
      <button class="btn primary" id="modal-ok">确定</button>
    </div>
  </div>
</div>

<div id="toast" class="hidden"><span class="dot"></span><span id="toast-text"></span></div>

<script>
'use strict';

var TOKEN_KEY = 'atelyx-webui-token';
var NAME_KEY = 'atelyx-webui-name';
var THEME_KEY = 'atelyx-webui-theme';
var token = localStorage.getItem(TOKEN_KEY) || '';
var myName = localStorage.getItem(NAME_KEY) || '';
var adminFlag = false;
// 邀请码有效时长边界（小时）与次数上限取值上限，与服务端校验一致
var INVITE_MIN_HOURS = 1;
var INVITE_MAX_HOURS = 87600;
var INVITE_MAX_USES = 4294967295;
// 日志：窗口条数、整窗重取上限（= 服务端缓冲容量）、前端保留行数、实时流断开后的重试间隔
var LOG_WINDOW = 400;
var LOG_MAX = 2000;
var LOG_DOM_MAX = 2000;
var STREAM_RETRY_MS = 3000;
// 防重复提交：动作在途时忽略新的动作触发
var actionBusy = false;
var loginBusy = false;
var currentView = 'overview';

var logState = {
  level: 'info', lastSeq: 0, paused: false, active: false,
  controller: null, retryTimer: null, follow: true, streaming: false
};

var VIEW_META = {
  overview: { title: '概览', sub: '服务端运行状态与关键指标' },
  spaces: { title: '我的空间', sub: '成员名册、邀请码与空间设置' },
  devices: { title: '我的设备', sub: '已登录的设备会话' },
  admin: { title: '全服管理', sub: '全服用户与空间视图（仅服务器管理员）' },
  logs: { title: '服务日志', sub: '' }
};

function $(id) { return document.getElementById(id); }

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}

function fmtBytes(n) {
  if (n == null) return '–';
  var units = ['B', 'KB', 'MB', 'GB', 'TB'];
  var i = 0, v = n;
  while (v >= 1024 && i < units.length - 1) { v /= 1024; i++; }
  return (i === 0 ? v : v.toFixed(1)) + ' ' + units[i];
}

function pad2(n) { return (n < 10 ? '0' : '') + n; }

function fmtTime(sec) {
  if (!sec) return '–';
  var d = new Date(sec * 1000);
  return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()) +
    ' ' + pad2(d.getHours()) + ':' + pad2(d.getMinutes());
}

function fmtLogTime(ms) {
  var d = new Date(ms);
  return pad2(d.getHours()) + ':' + pad2(d.getMinutes()) + ':' + pad2(d.getSeconds()) +
    '.' + String(d.getMilliseconds()).padStart(3, '0');
}

/// 运行时长（人类可读：天 / 小时 / 分 / 秒，取前两档）。
function fmtDuration(sec) {
  if (!sec || sec < 0) return '–';
  var units = [[86400, '天'], [3600, '小时'], [60, '分'], [1, '秒']];
  var parts = [];
  for (var i = 0; i < units.length && parts.length < 2; i++) {
    var n = Math.floor(sec / units[i][0]);
    sec -= n * units[i][0];
    if (n > 0 || parts.length > 0) parts.push(n + ' ' + units[i][1]);
  }
  return parts.join(' ') || '0 秒';
}

var toastTimer = null;
function toast(msg, isErr) {
  var el = $('toast');
  $('toast-text').textContent = msg;
  el.classList.toggle('err', !!isErr);
  el.classList.remove('hidden');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function () { el.classList.add('hidden'); }, 3600);
}

// ===== 弹层（替代浏览器原生 prompt / confirm，保持页面风格统一） =====

var modalResolve = null;

function openModal(opts) {
  $('modal-title').textContent = opts.title || '';
  $('modal-text').textContent = opts.text || '';
  var field = $('modal-field');
  var input = $('modal-input');
  field.classList.toggle('hidden', !opts.label);
  if (opts.label) {
    $('modal-label').textContent = opts.label;
    input.value = opts.value || '';
    input.type = opts.password ? 'password' : 'text';
    input.placeholder = opts.placeholder || '';
  }
  var ok = $('modal-ok');
  ok.textContent = opts.okText || '确定';
  ok.classList.toggle('danger', !!opts.danger);
  ok.classList.toggle('primary', !opts.danger);
  $('modal').classList.remove('hidden');
  if (opts.label) { input.focus(); input.select(); } else { ok.focus(); }
  return new Promise(function (resolve) { modalResolve = resolve; });
}

function closeModal(result) {
  $('modal').classList.add('hidden');
  var done = modalResolve;
  modalResolve = null;
  if (done) done(result);
}

/// 单行文本输入：确定返回去空白后的文本（空文本不提交），取消返回 null。
function askText(opts) {
  return openModal(opts).then(function (r) {
    if (r !== true) return null;
    var v = $('modal-input').value.trim();
    return v || null;
  });
}

/// 二次确认：确定返回 true，取消返回 null。
function askConfirm(opts) {
  return openModal(opts).then(function (r) { return r === true ? true : null; });
}

$('modal-cancel').addEventListener('click', function () { closeModal(null); });
$('modal-ok').addEventListener('click', function () { closeModal(true); });
$('modal').addEventListener('click', function (ev) { if (ev.target === $('modal')) closeModal(null); });
document.addEventListener('keydown', function (ev) {
  if ($('modal').classList.contains('hidden')) return;
  if (ev.key === 'Escape') { ev.preventDefault(); closeModal(null); }
  if (ev.key === 'Enter' && ev.target.id !== 'modal-cancel') { ev.preventDefault(); closeModal(true); }
});

// ===== 请求原语 =====

// 统一请求原语：返回 { ok, status, data }，不做登录态处理。
// 网络层失败（连不上、中断）抛错并转成可读提示——浏览器原生的 "Failed to fetch"
// 对使用者没有信息量。
async function rawApi(method, path, body, authToken) {
  var opts = { method: method, headers: {} };
  if (authToken) opts.headers['Authorization'] = 'Bearer ' + authToken;
  if (body !== undefined) {
    opts.headers['Content-Type'] = 'application/json';
    opts.body = JSON.stringify(body);
  }
  var resp;
  try {
    resp = await fetch(path, opts);
  } catch (e) {
    throw new Error('网络请求失败：无法连接服务端');
  }
  var text = await resp.text();
  var data = null;
  if (text) { try { data = JSON.parse(text); } catch (e) { data = null; } }
  return { ok: resp.ok, status: resp.status, data: data };
}

// 已登录态的 API 调用：401 即清除本地登录态并回到登录页
async function api(method, path, body) {
  var r = await rawApi(method, path, body, token);
  if (r.status === 401) {
    logout(false);
    throw new Error('登录状态已失效，请重新登录');
  }
  if (!r.ok) throw new Error((r.data && r.data.error) || ('请求失败（HTTP ' + r.status + '）'));
  return r.data;
}

async function copyText(text) {
  try {
    await navigator.clipboard.writeText(text);
  } catch (e) {
    // 非安全上下文（明文 HTTP）没有 navigator.clipboard：退回临时文本域
    var ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy'); } catch (e2) {}
    document.body.removeChild(ta);
  }
}

async function guard(fn) {
  try { await fn(); } catch (e) { if (token) toast(e.message, true); }
}

function canView(name) {
  return (name !== 'admin' && name !== 'logs') || adminFlag;
}

function switchView(name) {
  if (!canView(name)) return;
  if (currentView === 'logs' && name !== 'logs') logsLeave();
  currentView = name;
  var items = $('nav').querySelectorAll('.nav-item');
  for (var i = 0; i < items.length; i++) {
    items[i].classList.toggle('active', items[i].getAttribute('data-view') === name);
  }
  var views = document.querySelectorAll('.view');
  for (var j = 0; j < views.length; j++) views[j].classList.add('hidden');
  $('view-' + name).classList.remove('hidden');
  $('view-title').textContent = VIEW_META[name].title;
  $('view-sub').textContent = VIEW_META[name].sub;
  $('view-sub').classList.toggle('hidden', !VIEW_META[name].sub);
  guard(function () { return loadView(name); });
}

/// 视图数据入口（切换与刷新共用）。
function loadView(name) {
  if (name === 'overview') return loadOverview();
  if (name === 'spaces') return loadSpaces();
  if (name === 'devices') return loadDevices();
  if (name === 'admin') return loadAdmin();

// 因此这里不占用顶部胶囊，避免停在「刷新中…」。
async function refreshCurrent() {
  if (currentView === 'logs') {
    await guard(logsResync);
    return;
  }
  setServerPill(true, '刷新中…');
  try {
    await loadView(currentView);
    setServerPill(true, '服务在线');
  } catch (e) {
    setServerPill(false, '连接失败');
    toast(e.message, true);
  }
}

function setLogLive(live, text) {
  logState.streaming = live;

function logQuery(limit, after) {
  return '/api/admin/logs?level=' + logState.level + '&limit=' + limit +

function logRow(e) {
  var row = document.createElement('div');
  row.className = 'log-row lv-' + e.level;
  var time = document.createElement('span');
  time.className = 'log-time';
  time.textContent = fmtLogTime(e.ts);
  var lv = document.createElement('span');
  lv.className = 'log-lv';
  lv.textContent = e.level;
  var msg = document.createElement('span');
  msg.className = 'log-msg';
  msg.textContent = e.message;
  if (e.fields) {
    var fields = document.createElement('span');
    fields.className = 'log-fields';
    fields.textContent = '  ' + e.fields;
    msg.appendChild(fields);
  }
  var target = document.createElement('span');
  target.className = 'log-target';
  target.textContent = e.target;
  target.title = e.target;
  row.appendChild(time);
  row.appendChild(lv);
  row.appendChild(msg);
  row.appendChild(target);
  return row;
}

function logBody() { return $('log-body'); }

/// 日志正文追加（行数超上限即丢最旧；`scroll` 决定是否跟随到底部）。
function appendLogs(entries, scroll) {
  var body = logBody();
  var empty = body.querySelector('.log-empty');
  if (empty) empty.remove();
  var frag = document.createDocumentFragment();
  for (var i = 0; i < entries.length; i++) {
    frag.appendChild(logRow(entries[i]));
    logState.lastSeq = Math.max(logState.lastSeq, entries[i].seq);
  }
  body.appendChild(frag);
  while (body.childElementCount > LOG_DOM_MAX) body.removeChild(body.firstChild);
  if (scroll !== false && logState.follow) body.scrollTop = body.scrollHeight;
  updateLogStat();
}

function updateLogStat() {
  var body = logBody();
  var n = body.querySelector('.log-empty') ? 0 : body.childElementCount;
  $('log-stat').textContent = '已显示 ' + n + ' 条' + (logState.lastSeq ? ' · 最新 #' + logState.lastSeq : '');
}

/// 拉取窗口并与本地对齐。
///
/// - 首次进入、或服务端重启（进程内序号复位，本地游标高于最新序号）→ 整窗重建；
/// - 否则只追加游标之后的条目。窗口没盖到游标处（条目多在一屏之外）时按缓冲满量重取一次，
///   重取后缓冲内最旧一条仍晚于游标，才说明游标之后的条目确已被环覆盖（与级别过滤无关，
///   被过滤掉的条目不构成「丢失」）。
async function logsSyncWindow() {
  var win = await api('GET', logQuery(LOG_WINDOW));
  var entries = win.entries;
  var rebuild = logState.lastSeq === 0 || win.latest < logState.lastSeq;
  if (!rebuild && entries.length > 0 && entries[0].seq > logState.lastSeq + 1) {
    win = await api('GET', logQuery(LOG_MAX));
    entries = win.entries;
  }
  if (rebuild) {
    logBody().textContent = '';
    appendLogs(entries, true);
    logState.lastSeq = win.latest;
  } else {
    appendLogs(entries.filter(function (e) { return e.seq > logState.lastSeq; }), true);
    if (win.first > logState.lastSeq + 1) {
      toast('日志产生过快，最旧一段已被服务端缓冲覆盖', true);
    }
    logState.lastSeq = Math.max(logState.lastSeq, win.latest);
  }
  if (logBody().childElementCount === 0) {
    logBody().innerHTML = '<div class="log-empty">该级别暂无日志。</div>';
  }
  updateLogStat();
}

/// SSE 帧取出 data 负载（忽略 keep-alive 注释行）。非 JSON 负载返回 null。
function ssePayload(raw) {
  var lines = raw.split('\n'), data = [];
  for (var i = 0; i < lines.length; i++) {
    if (lines[i].indexOf('data:') === 0) data.push(lines[i].slice(5).replace(/^ /, ''));
  }
  if (!data.length) return null;
  try { return JSON.parse(data.join('\n')); } catch (e) { return null; }
}

/// 实时流：单条事件即一条日志。断线后按固定间隔重试，重试期间由窗口同步兜底。
/// 入口先停掉已有流——任何时刻至多一条流在跑（否则被覆盖的旧流既停不掉，也会绕过暂停继续写）。
async function logsOpenStream() {
  if (!logState.active || logState.paused || logState.streaming) return;
  logsStopStream();
  var controller = new AbortController();
  logState.controller = controller;
  var resp;
  try {
    resp = await fetch('/api/admin/logs/stream?level=' + logState.level + '&after=' + logState.lastSeq, {
      headers: { 'Authorization': 'Bearer ' + token, 'Accept': 'text/event-stream' },
      signal: controller.signal
    });
  } catch (e) {
    // 主动中断（暂停 / 切级别 / 刷新 / 离开视图）不算断线，不排重连
    if (!controller.signal.aborted) logsScheduleRetry();
    return;
  }
  if (resp.status === 401) {
    logout(false);
    toast('登录状态已失效，请重新登录', true);
    return;
  }
  if (!resp.ok || !resp.body) {
    // 403 是权限结论而非暂时故障：重试不会自愈，如实停在无权限态
    setLogLive(false, resp.status === 403 ? '无权限' : '连接失败');
    if (resp.status !== 403) logsScheduleRetry();
    return;
  }
  setLogLive(true, '实时');
  var reader = resp.body.getReader();
  var decoder = new TextDecoder();
  var buf = '';
  var handleFrame = function (raw) {
    var entry = ssePayload(raw);
    if (entry && entry.seq > logState.lastSeq) appendLogs([entry], true);
  };
  try {
    for (;;) {
      var chunk = await reader.read();
      if (chunk.done) break;
      buf += decoder.decode(chunk.value, { stream: true });
      var cut;
      while ((cut = buf.indexOf('\n\n')) >= 0) {
        handleFrame(buf.slice(0, cut));
        buf = buf.slice(cut + 2);
      }
    }
    // 收尾：冲掉解码器里未落地的字节，并处理末帧不带空行的情形
    buf += decoder.decode();
    handleFrame(buf);
  } catch (e) {
    // 主动中断与网络中断都走这里，由下方判断是否重连
  }
  if (logState.active && !logState.paused && !controller.signal.aborted) {
    setLogLive(false, '已断开');
    logsScheduleRetry();
  }
}

function logsScheduleRetry() {
  if (!logState.active || logState.paused || logState.streaming || logState.retryTimer) return;
  logState.retryTimer = setTimeout(async function () {
    logState.retryTimer = null;
    if (!logState.active || logState.paused) return;
    // 重试期间先补一次窗口：流不可用时至少按固定间隔更新，不至于完全停在旧内容
    try { await logsSyncWindow(); } catch (e) { /* 下次重试再补 */ }
    logsOpenStream();
  }, STREAM_RETRY_MS);
}

/// 停掉实时流与重试定时器。不动 `active` / `paused` / 面板内容——
/// 暂停、切级别、离开视图各自在此之上决定后续动作。标签按当前态落：暂停中仍是「已暂停」。
function logsStopStream() {
  if (logState.controller) logState.controller.abort();
  logState.controller = null;
  if (logState.retryTimer) clearTimeout(logState.retryTimer);
  logState.retryTimer = null;
  setLogLive(false, logState.paused ? '已暂停' : '未连接');
}

function logsClear() {
  logBody().textContent = '';
  logState.lastSeq = 0;
}

async function logsEnter() {
  logState.active = true;
  logState.paused = false;
  logState.follow = true;
  logsStopStream();
  logsClear();
  logBody().innerHTML = '<div class="log-empty">正在读取日志…</div>';
  updateLogPause();
  setLogLive(false, '连接中…');
  try {
    await logsSyncWindow();
  } catch (e) {
    logBody().innerHTML = '<div class="log-empty">' + esc(e.message) + '</div>';
    setLogLive(false, '读取失败');
    return;
  }
  logsOpenStream();
}

/// 离开日志视图：停流、清空并复位游标（下次进入重新取窗口）。
function logsLeave() {
  logState.active = false;
  logState.paused = false;
  logsStopStream();
  logsClear();
}

/// 手动刷新日志视图：重置游标并重连（窗口 + 实时流）。
async function logsResync() {
  if (!logState.active) return;
  logsStopStream();
  logsClear();
  logBody().innerHTML = '<div class="log-empty">正在读取日志…</div>';
  if (!logState.paused) setLogLive(false, '连接中…');
  try {
    await logsSyncWindow();
  } catch (e) {
    logBody().innerHTML = '<div class="log-empty">' + esc(e.message) + '</div>';
    setLogLive(false, '读取失败');
    throw e;
  }
  if (!logState.paused) logsOpenStream();
}

function updateLogPause() {
  $('log-pause-icon').innerHTML = logState.paused ? ICON_PLAY : ICON_PAUSE;
  $('log-pause-text').textContent = logState.paused ? '继续' : '暂停';
}

$('btn-log-pause').addEventListener('click', async function () {
  if (!logState.active) return;
  logState.paused = !logState.paused;
  updateLogPause();
  if (logState.paused) {
    logsStopStream();
    return;
  }
  // 继续：先补齐暂停期间产生的条目，再重连实时流
  setLogLive(false, '连接中…');
  try {
    await logsSyncWindow();
  } catch (e) {
    setLogLive(false, '读取失败');
    toast(e.message, true);
    return;
  }
  logsOpenStream();
});

$('log-level').addEventListener('change', async function (ev) {
  logState.level = ev.target.value;
  if (!logState.active) return;
  logsStopStream();
  logsClear();
  logBody().innerHTML = '<div class="log-empty">正在读取日志…</div>';
  if (!logState.paused) setLogLive(false, '连接中…');
  try {
    // 暂停态也照常重取窗口（过滤条件要立刻可见），只是不重连实时流
    await logsSyncWindow();
  } catch (e) {
    logBody().innerHTML = '<div class="log-empty">' + esc(e.message) + '</div>';
    setLogLive(false, '读取失败');
    toast(e.message, true);
    return;
  }
  if (!logState.paused) logsOpenStream();
});

// 滚动位置决定是否跟随：贴底即跟随，向上翻看即停住不跳
$('log-body').addEventListener('scroll', function () {
  var body = logBody();
  logState.follow = body.scrollHeight - body.scrollTop - body.clientHeight < 24;
});

// ===== 动作（事件委托） =====

// 数字输入解析：空串 = 缺省（null）；非正整数 = NaN（由调用方显式报错，不静默当缺省）
function parseCount(v) {
  var s = String(v).trim();
  if (!s) return null;
  var n = Number(s);
  return Number.isInteger(n) && n > 0 ? n : NaN;
}

async function createSpaceFlow() {
  var name = await askText({ title: '新建空间', label: '空间名称（不超过 64 字）', okText: '创建' });
  if (!name) return;
  await api('POST', '/api/spaces', { name: name });
  toast('空间已创建');
  await guard(loadSpaces);
}

async function renameSpaceFlow(btn) {
  var cur = btn.getAttribute('data-name');
  var next = await askText({ title: '空间改名', label: '新的空间名称', value: cur, okText: '保存' });
  if (!next || next === cur) return;
  await api('PATCH', '/api/spaces/' + btn.getAttribute('data-id'), { name: next });
  toast('已改名');
  await guard(loadSpaces);
}

async function createInviteFlow(btn) {
  var form = btn.closest('.invite-form');
  var hours = parseCount(form.querySelector('[data-field="hours"]').value);
  var maxUses = parseCount(form.querySelector('[data-field="maxUses"]').value);
  if (Number.isNaN(hours) || (hours !== null && (hours < INVITE_MIN_HOURS || hours > INVITE_MAX_HOURS))) {
    toast('有效时长须为 ' + INVITE_MIN_HOURS + '–' + INVITE_MAX_HOURS + ' 之间的整数小时（留空 = 长期有效）', true);
    return;
  }
  if (Number.isNaN(maxUses) || (maxUses !== null && (maxUses < 1 || maxUses > INVITE_MAX_USES))) {
    toast('次数上限须为 1–' + INVITE_MAX_USES + ' 之间的整数（留空 = 不限）', true);
    return;
  }
  var body = { role: form.querySelector('[data-field="role"]').value };
  if (hours !== null) body.expiresInHours = hours;
  if (maxUses !== null) body.maxUses = maxUses;
  var created = await api('POST', '/api/spaces/' + form.getAttribute('data-space') + '/invites', body);
  await copyText(created.code);
  toast('邀请码已签发并复制：' + created.code);
  await guard(loadSpaces);
}

async function resetPasswordFlow(btn) {
  var uname = btn.getAttribute('data-name');
  var pwd = await askText({
    title: '重置密码', text: '为用户「' + uname + '」设置新密码（6–128 字节）。',
    label: '新密码', password: true, okText: '下一步'
  });
  if (!pwd) return;
  var ok = await askConfirm({ title: '确认重置', text: '重置后该用户的全部设备会话将被吊销。', okText: '重置并吊销', danger: true });
  if (!ok) return;
  await api('POST', '/api/admin/users/' + btn.getAttribute('data-id') + '/reset-password', { newPassword: pwd });
  toast('密码已重置，其全部会话已吊销');
  await guard(loadAdmin);
}

document.addEventListener('click', async function (ev) {
  // 空间卡内的分段切换（成员 / 邀请码）
  var seg = ev.target.closest('[data-pane]');
  if (seg) {
    var card = seg.closest('.space-card');
    var segs = card.querySelectorAll('.seg button');
    for (var i = 0; i < segs.length; i++) segs[i].classList.toggle('active', segs[i] === seg);
    var panes = card.querySelectorAll('.pane');
    for (var j = 0; j < panes.length; j++) {
      panes[j].classList.toggle('hidden', panes[j].getAttribute('data-pane-id') !== seg.getAttribute('data-pane'));
    }
    return;
  }

  var btn = ev.target.closest('[data-act]');
  if (!btn || actionBusy) return;
  actionBusy = true;
  var act = btn.getAttribute('data-act');
  try {
    if (act === 'space-new') {
      await createSpaceFlow();
    } else if (act === 'join-invite') {
      var code = $('join-code').value.trim();
      if (!code) return;
      var r = await api('POST', '/api/invites/accept', { code: code });
      $('join-code').value = '';
      toast('已加入空间「' + (r.name || '') + '」（' + (r.role || '') + '）');
      await guard(loadSpaces);
    } else if (act === 'space-rename') {
      await renameSpaceFlow(btn);
    } else if (act === 'invite-create') {
      await createInviteFlow(btn);
    } else if (act === 'invite-revoke') {
      var ivCode = btn.getAttribute('data-code');
      var okInvite = await askConfirm({ title: '吊销邀请码', text: '邀请码 ' + ivCode + ' 将立即失效。', okText: '吊销', danger: true });
      if (!okInvite) return;
      await api('DELETE', '/api/spaces/' + btn.getAttribute('data-space') + '/invites/' + ivCode);
      toast('邀请码已吊销');
      await guard(loadSpaces);
    } else if (act === 'copy-code') {
      await copyText(btn.getAttribute('data-code'));
      toast('已复制邀请码');
    } else if (act === 'device-revoke') {
      var okDevice = await askConfirm({ title: '吊销设备会话', text: '该设备将退出登录。', okText: '吊销', danger: true });
      if (!okDevice) return;
      await api('DELETE', '/api/auth/devices/' + btn.getAttribute('data-id'));
      toast('会话已吊销');
      await guard(loadDevices);
    } else if (act === 'user-reset') {
      await resetPasswordFlow(btn);
    } else if (act === 'user-revoke') {
      var target = btn.getAttribute('data-name');
      var okUser = await askConfirm({ title: '吊销全部会话', text: '将用户「' + target + '」的全部设备踢下线。', okText: '吊销', danger: true });
      if (!okUser) return;
      var rr = await api('DELETE', '/api/admin/users/' + btn.getAttribute('data-id') + '/sessions');
      toast('已吊销 ' + (rr.revoked || 0) + ' 个会话');
      await guard(loadAdmin);
    }
  } catch (e) {
    if (token) toast(e.message, true);
  } finally {
    actionBusy = false;
  }
});

// 回车即提交加入邀请码
$('join-code').addEventListener('keydown', function (ev) {
  if (ev.key === 'Enter') {
    ev.preventDefault();
    var join = document.querySelector('[data-act="join-invite"]');
    if (join) join.click();
  }
});

// ===== 登录与启动 =====

function showLogin() {
  logsLeave();
  $('login').classList.remove('hidden');
  $('shell').classList.add('hidden');
  $('login-error').classList.add('hidden');
  $('login-password').value = '';
}

function showApp() {
  $('login').classList.add('hidden');
  $('shell').classList.remove('hidden');
  $('who').textContent = myName || '';
  $('who-avatar').textContent = (myName || '·').slice(0, 1).toUpperCase();
}

function logout(callServer) {
  if (callServer && token) {
    fetch('/api/auth/logout', { method: 'POST', headers: { 'Authorization': 'Bearer ' + token } }).catch(function () {});
  }
  token = '';
  myName = '';
  adminFlag = false;
  logsLeave();
  localStorage.removeItem(TOKEN_KEY);
  localStorage.removeItem(NAME_KEY);
  showLogin();
}

$('btn-logout').addEventListener('click', function () { logout(true); });
$('btn-refresh').addEventListener('click', refreshCurrent);

$('login-form').addEventListener('submit', async function (ev) {
  ev.preventDefault();
  if (loginBusy) return;
  loginBusy = true;
  var username = $('login-username').value.trim();
  var password = $('login-password').value;
  var errEl = $('login-error');
  errEl.classList.add('hidden');
  try {
    // 登录请求不走 api()：未登录时的 401 是业务结果（用户名或密码错误），不触发登出清理
    var r = await rawApi('POST', '/api/auth/login', {
      username: username,
      password: password,
      deviceName: '网页管理台'
    }, '');
    if (!r.ok) throw new Error((r.data && r.data.error) || ('登录失败（HTTP ' + r.status + '）'));
    token = r.data.token;
    myName = r.data.displayName || r.data.username || username;
    localStorage.setItem(TOKEN_KEY, token);
    localStorage.setItem(NAME_KEY, myName);
    showApp();
    switchView('overview');
  } catch (e) {
    errEl.textContent = e.message;
    errEl.classList.remove('hidden');
  } finally {
    loginBusy = false;
  }
});

applyTheme();
updateLogPause();
if (token) {
  showApp();
  switchView('overview');
} else {
  showLogin();
}
</script>
